---
name: Publish docs via GitHub Pages

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  # The changelog is fetched from the Releases API at build time, so a new release
  # has to republish the site to appear.
  release:
    types: [published]
  workflow_dispatch:

# OIDC deployment; requires Settings -> Pages -> Source: "GitHub Actions".
permissions:
  contents: read

# Let an in-flight deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # renovate: datasource=github-tags depName=astral-sh/setup-uv
      - name: Install uv
        # zizmor: ignore[cache-poisoning] — `enable-cache` below already excludes the
        # publishing trigger, but zizmor cannot evaluate the expression statically.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # A release-triggered build publishes without a reviewed push behind it, so it
          # must not restore a cache that any pull request run could have written.
          enable-cache: ${{ github.event_name != 'release' }}

      # Quarto and its pandoc come from `quarto-cli` in uv.lock; no separate install step.
      - name: Install dependencies
        run: uv sync

      - name: Build site
        # Token lifts the anonymous API rate limit for the changelog's Releases fetch.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run great-docs build

      # renovate: datasource=github-tags depName=actions/upload-pages-artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: great-docs/_site
          # Without this the action's tar drops `.well-known/`, and agent skill discovery 404s.
          include-hidden-files: true

  deploy:
    name: Deploy docs
    needs: build
    # A `release` event runs against `refs/tags/<tag>`, not `refs/heads/main`.
    if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write # `deploy-pages` publishes
      id-token: write # ...and exchanges an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # renovate: datasource=github-tags depName=actions/deploy-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
