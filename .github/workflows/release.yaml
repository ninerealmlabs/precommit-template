---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Release"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

# The app token carries its own `contents: write`; `GITHUB_TOKEN` only fetches the checkout.
permissions:
  contents: read

jobs:
  release:
    if: ${{ github.repository == 'ninerealmlabs/precommit-template' }}
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # `gh` authenticates with the app token

      # Releasing as the app, rather than with `GITHUB_TOKEN`, is what lets the
      # `release` event start the docs rebuild: events raised by `GITHUB_TOKEN`
      # do not trigger workflows.
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ vars.APP_CLIENT_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"
          # Narrow the installation's blanket grant to what `gh release create` needs.
          permission-contents: write

      - name: Create Release
        shell: bash
        env:
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"
        run: |
          # Retrieve previous release tag; `--json` names the field, where the column
          # layout of the default table output is not a stable contract.
          previous_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          previous_major="${previous_tag%%\.*}"
          previous_minor="${previous_tag#*.}"
          previous_minor="${previous_minor%.*}"
          previous_patch="${previous_tag##*.}"
          # Determine next release tag
          next_major_minor="$(date +'%Y').$(date +'%-m')"
          if [[ "${previous_major}.${previous_minor}" == "${next_major_minor}" ]]; then
              echo "Month release already exists for year, incrementing patch number by 1"
              next_patch="$((previous_patch + 1))"
          else
              echo "Month release does not exist for year, setting patch number to 0"
              next_patch="0"
          fi
          # Create release
          release_tag="${next_major_minor}.${next_patch}"
          gh release create "${release_tag}" \
              --repo="${GITHUB_REPOSITORY}" \
              --title="${release_tag}" \
              --generate-notes
