---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Release"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write # `gh release create` writes the tag and release
  actions: write # dispatching the docs rebuild

jobs:
  release:
    if: ${{ github.repository == 'ninerealmlabs/precommit-template' }}
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # `gh` authenticates with `GITHUB_TOKEN`

      - name: Create Release
        shell: bash
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # Retrieve previous release tag; `--json` names the field, where the column
          # layout of the default table output is not a stable contract.
          previous_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          previous_major="${previous_tag%%\.*}"
          previous_minor="${previous_tag#*.}"
          previous_minor="${previous_minor%.*}"
          previous_patch="${previous_tag##*.}"
          # Determine next release tag
          next_major_minor="$(date +'%Y').$(date +'%-m')"
          if [[ "${previous_major}.${previous_minor}" == "${next_major_minor}" ]]; then
              echo "Month release already exists for year, incrementing patch number by 1"
              next_patch="$((previous_patch + 1))"
          else
              echo "Month release does not exist for year, setting patch number to 0"
              next_patch="0"
          fi
          # Create release
          release_tag="${next_major_minor}.${next_patch}"
          gh release create "${release_tag}" \
              --repo="${GITHUB_REPOSITORY}" \
              --title="${release_tag}" \
              --generate-notes

      # The docs changelog is fetched from the Releases API at build time, and the docs
      # workflow only runs on pushes to `main`. Dispatch it so the new release is published
      # instead of waiting for the next merge. A `release` trigger would not work: events
      # raised by `GITHUB_TOKEN` do not start workflows, and `workflow_dispatch` is one of
      # the few exceptions to that rule.
      - name: Rebuild docs with the new release
        shell: bash
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: gh workflow run docs-pages.yaml --repo="${GITHUB_REPOSITORY}" --ref main
